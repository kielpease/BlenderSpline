  "tangent_drag.py",
  "transform_gizmos.py",
  "edit_drag.py",
  "drag_navigation.py",
  "lifecycle.py",
  "edit_snapping.py",
  "segment_selection.py",
  "insert_vertex.py",
  "topology_edit.py",
  "curve_connections.py",
  "make_planar.py",
  "profile.py",
  "profile_corners.py",
  "region_geometry.py", "region_selection.py",
  "display.py",
]
