schema_version = "1.0.0"
id = "spline_maker"
version = "1.1.0"
name = "Spline"
tagline = "A simple and classic way to draw and edit splines in Blender"
maintainer = "Pease Technology"
website = "https://github.com/kielpease/BlenderSpline"
type = "add-on"
tags = ["Add Curve", "Modeling", "3D View"]
