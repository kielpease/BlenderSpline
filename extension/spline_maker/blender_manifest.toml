schema_version = "1.0.0"
id = "spline_maker"
version = "0.18.0"
name = "Splines"
tagline = "Draw and edit splines in the 3D Viewport"
maintainer = "Spline Maker Project"
type = "add-on"
blender_version_min = "5.2.4"
# Required by Blender for local packaging. Replace once the owner selects a license.
license = ["License pending (local testing only)"]

[build]
paths = [
  "__init__.py", "ui.py", "feasibility.py", "drawing_plane.py", "drawing_probe.py",
  "vertex_selection.py",
  "vertex_types.py",
  "tangent_drag.py",
  "transform_gizmos.py",
  "edit_drag.py",
  "drag_navigation.py",
  "lifecycle.py",
  "edit_snapping.py",
  "segment_selection.py",
  "region_geometry.py", "region_selection.py",
  "display.py",
]
